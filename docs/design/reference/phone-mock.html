:root{--ground:#121110;--lit:#ff3b1f;--ghost:#2b1915;--amber:#ffb000;--label:#c2b3ab;--quiet:#9a8c85;--dimlabel:#9a7a70;--text:#e6dad3;--rubber:#24211f;--rule:#2a2725;--gut:10px;--bar:64px;--dockh:56px}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ground);color:var(--label);-webkit-text-size-adjust:100%;scrollbar-color:#3a3330 var(--ground)}
body{font-family:"Barlow Semi Condensed",system-ui,sans-serif;min-height:100dvh;padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom) + 8px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
::selection{background:var(--lit);color:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.seg{position:relative;display:inline-block;line-height:1;white-space:pre;direction:ltr}
.seg .g{color:var(--ghost)}.seg .l{position:absolute;inset:0;color:var(--lit)}

/* ---------- head unit: the radio, cut down to what a thumb needs ---------- */
.unit{position:relative;padding:env(safe-area-inset-top) var(--gut) 0;direction:ltr}
.top{position:relative;height:60px}
.antenna{position:absolute;right:46px;bottom:-6px;width:6px;height:54px;transform-origin:50% 100%;transform:rotate(-13deg);
  background:linear-gradient(90deg,#4a4642,#bdb7b0 45%,#6d6863 60%,#3a3633);border-radius:3px}
.antenna::before{content:"";position:absolute;left:-1px;right:-1px;top:24px;height:3px;background:#2a2725}
.antenna::after{content:"";position:absolute;left:50%;top:-8px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9e3dc,#77716b 70%)}
.antenna .tip{position:absolute;left:50%;top:-4px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--lit);opacity:0;transition:opacity .15s;z-index:1}
.antenna.rx .tip{opacity:1}
.keys{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);display:flex;gap:6px}
.pk{position:relative;width:48px;height:26px;border-radius:6px 6px 0 0;background:linear-gradient(#3a3532,#26221f);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-family:"DSEG7";font-size:12px;color:#a99189;display:grid;place-items:start center;padding-top:5px;transition:transform .12s cubic-bezier(.2,.9,.3,1)}
.pk::before{content:"";position:absolute;inset:-20px -3px 0}
.pk[aria-pressed="true"]{transform:translateY(7px);color:var(--lit);background:linear-gradient(#2e2a27,#1f1c1a)}
.case{position:relative;z-index:1;border-radius:22px;background:linear-gradient(180deg,#2a2522,#1c1917 58%,#171412);
  box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -3px 0 rgba(0,0,0,.35);padding:12px;display:grid;gap:8px}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#57514c,#2a2623)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:4px;height:1px;background:#171412;transform:rotate(35deg)}
.s1{left:6px;top:6px}.s2{right:6px;top:6px}.s3{left:6px;bottom:6px}.s4{right:6px;bottom:6px}

.lcd{border-radius:9px;background:#0b0a09;box-shadow:inset 0 2px 10px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.05);padding:10px 14px;
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"fm dg side" "al al mt";column-gap:12px;row-gap:8px;align-items:end;container-type:inline-size}
.fm{grid-area:fm;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--lit);padding-bottom:6px}
.digits{grid-area:dg;font-family:"DSEG7";font-size:clamp(34px,13.5cqi,46px)}
.side{grid-area:side;align-self:stretch;display:grid;justify-items:end;align-content:space-between}
.mhz{font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--quiet)}
.lamps{display:flex;gap:10px}
.lamp{font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--dimlabel)}
.lamp.on{color:var(--lit)}.lamp.amber.on{color:var(--amber)}

.plate{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}

/* ---------- docked tuner: the LCD follows you down the page ---------- */
.dock{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 6px) var(--gut) 6px;
  background:linear-gradient(180deg,#2a2522,#1c1917);box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 -1px 0 rgba(0,0,0,.4);
  display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;transform:translateY(-110%);transition:transform .3s cubic-bezier(.16,1,.3,1);direction:ltr}
.dock.on{transform:none}
.mlcd{height:44px;border-radius:8px;background:#0b0a09;box-shadow:inset 0 2px 8px rgba(0,0,0,.9);display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0;overflow:hidden}
.mlcd .fm{padding:0;font-size:12px}
.md{font-family:"DSEG7";font-size:22px}
.ma{font-family:"DSEG14";font-size:15px;letter-spacing:.04em}
.mlamp{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#4a302a;flex:none}.mlamp.on{background:var(--lit)}

/* ---------- program: LED wall strip, then the panel ---------- */
.program{margin-top:10px}
.strip{position:relative;height:144px}
#wall{position:absolute;inset:0;width:100%;height:100%}
.panel{position:relative;margin:-16px var(--gut) 0;border-radius:12px;background:rgba(18,17,16,.96);box-shadow:inset 0 0 0 1px var(--rule),0 -6px 24px rgba(0,0,0,.35);overflow:hidden;container-type:inline-size}
.view{padding:22px 18px 26px}
.view.in>*{animation:slin .55s cubic-bezier(.16,1,.3,1) both}.view.in>*:nth-child(2){animation-delay:.06s}.view.in>*:nth-child(3){animation-delay:.12s}.view.in>*:nth-child(4){animation-delay:.18s}.view.in>*:nth-child(5){animation-delay:.24s}
@keyframes slin{from{opacity:0;transform:translateY(14px);filter:blur(3px)}}
#static{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;opacity:0;mix-blend-mode:screen}
.hint{padding:18px var(--gut) 8px;text-align:center;font-weight:500;font-size:15px;color:var(--quiet)}.hint b{color:var(--label);font-weight:700}

.k{font-weight:700;font-size:13px;letter-spacing:.22em;color:var(--lit)}
.big{font-weight:600;font-size:2.1rem;line-height:1.04;color:var(--text);margin:6px 0 12px;text-wrap:balance}
.lede{font-size:1.18rem;line-height:1.45;color:var(--text)}
.txt{font-size:1.06rem;line-height:1.55;color:#d8ccc5}
.lede+.txt,.txt+.list{margin-top:12px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin-top:16px;font-size:1.02rem}
.facts dt{font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--quiet);padding-top:3px}.facts dd{color:var(--text)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.act{flex:1 1 auto;height:44px;padding:0 16px;border-radius:6px;background:var(--rubber);box-shadow:0 3px 0 #0a0908,0 5px 10px rgba(0,0,0,.5);font-weight:700;font-size:13px;letter-spacing:.16em;color:var(--text)}

/* ---------- player: a slim bar under the thumb ---------- */
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;height:calc(var(--bar) + env(safe-area-inset-bottom));padding:0 var(--gut) env(safe-area-inset-bottom);
  display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:12px;background:#181615;box-shadow:inset 0 1px 0 var(--rule),0 -10px 24px rgba(0,0,0,.45);direction:ltr}

.mini{height:44px;display:flex;align-items:center;gap:8px;padding:0 4px 0 8px;font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--label)}
.mini i{width:9px;height:9px;border-radius:50%;background:#4a302a}.mini[aria-pressed="true"] i{background:var(--lit)}

/* ---------- phone on its side: head unit left, program right ---------- */
@media (orientation:landscape) and (max-height:520px){
  :root{--bar:56px}
  body{display:grid;grid-template-columns:minmax(330px,42%) minmax(0,1fr);column-gap:12px;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .unit{position:sticky;top:0;align-self:start;height:calc(100dvh - var(--bar));padding-top:10px;display:grid;align-content:center}

  .digits{font-size:clamp(30px,11cqi,40px)}

  .program{margin:10px 0 0;padding-right:var(--gut)}
  .strip{height:112px}
  .panel{margin-inline:0}
  .dock{display:none}
}
@media (prefers-reduced-motion:reduce){.view.in>*{animation:none}.dock{transition:none}.pk{transition:none}}

/* ---------- the board: what a wide window shows ---------- */
.board{padding:40px 32px 64px;min-height:100vh;overflow:auto}

 row.innerHTML=`<button class="bandkey" data-band="${bi}"><span class="sr">Band </span><b>${bi+1}</b><span>${name}</span></button><div class="track"></div>`;
 const tr=row.querySelector('.track');
 S.filter(s=>s.b===bi).forEach(s=>{const b=document.createElement('button');b.className='stn';b.textContent=s.k;b.style.left=((s.f-LO-bi*PER)/PER*100)+'%';s.el=b;b.dataset.f=s.f;tr.appendChild(b)});

const rowEls=[...rowsEl.querySelectorAll('.row')];
const pkeys=BANDS.map((n,i)=>{const b=document.createElement('button');b.className='pk';b.textContent=i+1;b.tabIndex=-1;b.onclick=()=>preset(i);$('pkeys').appendChild(b);return b});
const sm=$('sm');for(let i=0;i<10;i++){const s=document.createElement('i');if(i>7)s.className='hi';sm.appendChild(s)}const smI=[...sm.children];

// ---------- tuning ----------
function preset(i){tuneTo(S.find(s=>s.b===i).f)}
function tuneTo(fr){target=clampF(fr);lastMove=performance.now();if(reduce)f=target}
function nearest(fr){let best=S[0];for(const s of S)if(Math.abs(s.f-fr)<Math.abs(best.f-fr))best=s;return best}
function seek(d){if(d>0){const n=S.find(s=>s.f>target+.05);tuneTo(n?n.f:S[0].f)}else{const p=[...S].reverse().find(s=>s.f<target-.05);tuneTo(p?p.f:S[S.length-1].f)}}
let fromDock=false;
document.querySelectorAll('[data-seek]').forEach(b=>b.onclick=()=>{fromDock=!!b.closest('.dock');seek(+b.dataset.seek)});
rowsEl.addEventListener('click',e=>{const k=e.target.closest('.bandkey');if(k)preset(+k.dataset.band)});
$('view').addEventListener('click',e=>{const b=e.target.closest('[data-tune]');if(b)tuneTo(parseFloat(b.dataset.tune))});
addEventListener('keydown',e=>{const n=parseInt(e.key);if(n>=1&&n<=5)preset(n-1);if(e.key==='ArrowRight')seek(1);if(e.key==='ArrowLeft')seek(-1)});

// drag along the dial: the needle follows the finger (absolute), a tap tunes to the nearest station
let geo=[],drag=null;
function rowAt(ly){let ri=geo.findIndex(g=>ly<g.y+g.h);return ri<0?4:ri}
function freqAt(cx,cy){const r=rowsEl.getBoundingClientRect(),ri=rowAt(cy-r.top),g=geo[ri];return{ri,fr:LO+ri*PER+Math.max(0,Math.min(.9999,(cx-r.left-g.x)/g.w))*PER}}
rowsEl.addEventListener('pointerdown',e=>{if(e.target.closest('.bandkey')||e.button>0)return;drag={id:e.pointerId,x0:e.clientX,y0:e.clientY,moved:false}});
rowsEl.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
 if(!drag.moved){if(Math.abs(dx)<6||Math.abs(dx)<Math.abs(dy))return;drag.moved=true;dragging=true;rowsEl.setPointerCapture(e.pointerId)}
 f=target=freqAt(e.clientX,e.clientY).fr;lastMove=performance.now()});
const endDrag=e=>{if(!drag||e.pointerId!==drag.id)return;const was=drag;drag=null;
 if(was.moved){dragging=false;lastMove=performance.now();return}
 if(e.type!=='pointerup')return;
 const st=e.target.closest('.stn');if(st){tuneTo(+st.dataset.f);return}
 const {ri,fr}=freqAt(e.clientX,e.clientY);let best=null;for(const s of S)if(s.b===ri&&(!best||Math.abs(s.f-fr)<Math.abs(best.f-fr)))best=s;if(best)tuneTo(best.f)};
rowsEl.addEventListener('pointerup',endDrag);rowsEl.addEventListener('pointercancel',endDrag);

// ---------- dial scale ----------
const sc=$('scale'),sx=sc.getContext('2d');
function layout(){const dpr=devicePixelRatio||1,r=rowsEl.getBoundingClientRect();sc.width=r.width*dpr;sc.height=r.height*dpr;sx.setTransform(dpr,0,0,dpr,0,0);
 geo=rowEls.map(el=>{const t=el.querySelector('.track').getBoundingClientRect(),e=el.getBoundingClientRect();return{x:t.left-r.left,y:e.top-r.top,w:t.width,h:e.height}})}
function drawDial(){const r=rowsEl.getBoundingClientRect();sx.clearRect(0,0,r.width,r.height);const ar=Math.min(4,Math.floor((f-LO)/PER));
 geo.forEach((g,ri)=>{const base=g.y+g.h-2,on=ri===ar;
  for(let i=0;i<=40;i++){const x=g.x+i/40*g.w,maj=i%10===0;sx.fillStyle=on?'rgba(255,59,31,.55)':'#2b1915';sx.fillRect(x-1,base-(maj?7:4),2,maj?7:4)}
  S.filter(s=>s.b===ri).forEach(s=>{const x=g.x+(s.f-LO-ri*PER)/PER*g.w;sx.fillStyle=locked===s?'#ffb000':on?'#ff3b1f':'#3a201a';sx.fillRect(x-2.5,base-13,5,5)})});
 const g0=geo[ar],nx=g0.x+((f-LO-ar*PER)/PER)*g0.w,top=geo[0].y+2,bot=geo[4].y+geo[4].h;
 for(let y=top;y<bot;y+=7){const inRow=y>=g0.y&&y<=g0.y+g0.h;sx.fillStyle=inRow?'#ff3b1f':'rgba(255,59,31,.35)';sx.fillRect(nx-(inRow?2:1),y,inRow?4:2,4)}
 return{ar,nx,ny:g0.y+g0.h/2}}

// ---------- LED wall strip ----------
const strip=$('strip'),wall=$('wall'),wx=wall.getContext('2d'),P=8;let WW=0,WH=0,STG=0,WR,WA,ghost,DPR=1,OX=0,ripples=[],nameBmp=null;
function wallLayout(){DPR=devicePixelRatio||1;const w=strip.clientWidth,h=strip.clientHeight;wall.width=w*DPR;wall.height=h*DPR;
 WW=Math.floor(w/P);WH=Math.floor(h/P);STG=WH;OX=(w-WW*P)/2;WR=new Float32Array(WW*WH);WA=new Float32Array(WW*WH);
 ghost=document.createElement('canvas');ghost.width=w*DPR;ghost.height=h*DPR;const g=ghost.getContext('2d');g.scale(DPR,DPR);g.fillStyle='#121110';g.fillRect(0,0,w,h);g.fillStyle='#1d1310';
 for(let y=0;y<WH;y++)for(let x=0;x<WW;x++)g.fillRect(OX+x*P+1.5,y*P+1.5,P-3,P-3);nameBmp=null}
function put(B,x,y,v){x=Math.round(x);y=Math.round(y);if(x<0||x>=WW||y<0||y>=WH||v<=0)return;const i=y*WW+x;if(v>B[i])B[i]=v}
function bitmap(str,px){const c=document.createElement('canvas'),x=c.getContext('2d');const fnt=`800 ${px}px "Barlow Semi Condensed"`;x.font=fnt;x.letterSpacing=Math.round(px*.08)+'px';
 const w=Math.ceil(x.measureText(str).width)+4;c.width=w;c.height=Math.ceil(px*1.05);x.font=fnt;x.letterSpacing=Math.round(px*.08)+'px';x.textBaseline='top';x.fillStyle='#fff';x.fillText(str,0,Math.round(px*.02));
 const d=x.getImageData(0,0,w,c.height).data,m=new Uint8Array(w*c.height);for(let i=0;i<m.length;i++)m[i]=d[i*4+3]>130?1:0;return{w,h:c.height,m}}
const MORSE={H:'....',E:'.',L:'.-..',O:'---'};const morse=(()=>{const q=[];for(const ch of 'HELLO'){for(const m of MORSE[ch]){for(let i=0;i<(m==='.'?1:3);i++)q.push(1);q.push(0)}q.push(0,0)}for(let i=0;i<18;i++)q.push(0);return q})();
const ANIM=[
 (t,s)=>{if(!nameBmp)nameBmp=bitmap('AHMED HAMDAN  ·  ',STG-5);const b=nameBmp,off=Math.floor(t*14),y0=Math.max(1,Math.floor((STG-b.h)/2));
  for(let x=0;x<WW;x++){const cx=(x+off)%b.w;for(let y=0;y<b.h;y++)if(b.m[y*b.w+cx])put(WR,x,y0+y,s)}},
 (t,s)=>{const off=Math.floor(t*6);for(let x=0;x<WW;x+=2){const k=Math.floor(x/2)+off,h=2+Math.floor((Math.sin(k*1.7)*.5+.5)*(Math.sin(k*.27)*.5+.5)*(STG-4));
   for(let y=0;y<h;y++)put(WR,x,STG-1-y,s*(y===h-1?1:.55))}
  const cx=WW-1-(Math.floor(t*40)%WW);for(let y=0;y<STG;y++)put(WA,cx,y,s*.6)},
 (t,s)=>{const FW=Math.floor(WW*.26);for(let y=0;y<WH;y+=2)put(WA,FW,y,s*.7);
  for(let lane=0;lane<Math.floor(STG/3);lane++){const y=1+lane*3,sp=22+(lane%5)*7;for(let p=0;p<3;p++){const L=WW+50,raw=t*sp+p*71+lane*43,cyc=Math.floor(raw/L),x=WW-1-(raw%L);
   const bad=(p+lane*2+cyc)%6===0;
   if(!bad){put(WR,x,y,s);put(WR,x+1,y,s);put(WR,x+2,y,s*.5)}
   else if(x>FW+1){put(WA,x,y,s);put(WA,x+1,y,s);put(WA,x+2,y,s)}
   else{const k=(FW+1-x)/4;if(k<4)for(let j=0;j<8;j++){const a=j/8*Math.PI*2;put(WA,FW+1+Math.cos(a)*k*1.6,y+Math.sin(a)*k,s*(1-k/4))}}}}},
 (t,s)=>{for(let x=0;x<WW;x++){const a=Math.sin(x*.07+t)*Math.sin(x*.019-t*.32);put(WR,x,STG*.5+a*STG*.38,s);put(WA,x,STG*.5+Math.sin(x*.041-t*.6)*STG*.2,s*.4)}},
 (t,s)=>{const off=Math.floor(t*9),my=Math.floor(STG/2);for(let x=0;x<WW;x++){if(morse[(Math.floor(x/3)+off)%morse.length]){put(WR,x,my-1,s);put(WR,x,my,s);put(WR,x,my+1,s)}}
  for(let k=0;k<2;k++){const r=((t+k*1.1)*34)%(WW*1.3);for(let a=-1.4;a<=1.4;a+=.02)put(WA,r*Math.cos(a),WH*.5+r*Math.sin(a)*.8,s*(1-r/(WW*1.3))*.7)}}
];
function noise(n){if(n<=.02)return;for(let i=0;i<120*n;i++)put(WR,Math.random()*WW,Math.random()*STG,.2+Math.random()*.5*n);
 for(const st of S){const x=(st.f-f+2)/4*WW;if(x>=0&&x<WW)for(let y=0;y<STG;y++)if(Math.random()<.5)put(WR,x,y,.7*n)}}
function rippleFx(t){ripples=ripples.filter(r=>{const age=t-r.t0,R=age*.045;if(R>r.max)return false;const a=r.s*(1-R/r.max);for(let q=0;q<Math.PI*2;q+=1.2/Math.max(4,R))put(WA,r.x+Math.cos(q)*R,r.y+Math.sin(q)*R,a);return true})}
strip.addEventListener('pointerdown',e=>{const r=wall.getBoundingClientRect();ripples.push({x:(e.clientX-r.left-OX)/P,y:(e.clientY-r.top)/P,t0:performance.now(),s:1,max:30})});
let wallT=0,lastW=0;
function wallFrame(t,st,weight,isLock){if(t-lastW<33)return;const dt=Math.min(.1,(t-lastW)/1000);lastW=t;wallT+=dt;
 const dec=reduce?0:(st.b===0?.35:.74);for(let i=0;i<WR.length;i++){WR[i]*=dec;WA[i]*=dec}
 ANIM[st.b](reduce?3:wallT,weight);noise(isLock?0:1-weight);rippleFx(t);
 if(playing&&!reduce)for(let x=0;x<WW;x++){const v=Math.max(0,Math.sin(x*.5+t*.011)*Math.sin(x*.13-t*.004)),h=Math.round(v*4);for(let y=0;y<h;y++)put(WA,x,STG-1-y,.35)}
 wx.setTransform(DPR,0,0,DPR,0,0);wx.drawImage(ghost,0,0,ghost.width/DPR,ghost.height/DPR);
 for(let y=0;y<WH;y++)for(let x=0;x<WW;x++){const i=y*WW+x,a=WA[i],r=WR[i];if(a>.05){wx.fillStyle=`rgba(255,176,0,${Math.min(1,a)})`;wx.fillRect(OX+x*P+1.5,y*P+1.5,P-3,P-3)}
  else if(r>.05){wx.fillStyle=`rgba(255,59,31,${Math.min(1,r)})`;wx.fillRect(OX+x*P+1.5,y*P+1.5,P-3,P-3)}}}

// ---------- panel ----------
const view=$('view'),stc=$('static'),stx=stc.getContext('2d'),simg=stx.createImageData(200,120);
const GL='abcdefghijklmnopqrstuvwxyz0123456789';let decs=[];
function show(st){view.classList.remove('in');view.innerHTML=st.v();void view.offsetWidth;view.classList.add('in');
 decs=reduce?[]:[...view.querySelectorAll('[data-decode]')].map(el=>({el,text:el.textContent,t0:performance.now()}))}
function stepDecode(t){decs=decs.filter(d=>{const k=Math.min(1,(t-d.t0)/600),n=Math.floor(d.text.length*k);
 d.el.textContent=d.text.slice(0,n)+d.text.slice(n).replace(/\S/g,()=>GL[Math.random()*GL.length|0]);return k<1})}
function idle(){view.classList.remove('in');view.innerHTML=`<div class="idle"><p class="k">BETWEEN STATIONS</p><h2 class="big">Turn the dial</h2><p class="txt">Let go near a station and it locks in.</p></div>`}
function staticFx(op){stc.style.opacity=op.toFixed(2);if(op<.02)return;const d=simg.data;for(let i=0;i<d.length;i+=4){const v=Math.random()*255;d[i]=v;d[i+1]=v*.45;d[i+2]=v*.35;d[i+3]=Math.random()<.5?255:0}stx.putImageData(simg,0,0)}

// ---------- docked tuner ----------
const dock=$('dock');let dockOn=false;
function dockCheck(){const on=getComputedStyle(dock).display!=='none'&&(r=>r.top+r.height/2)(rowsEl.getBoundingClientRect())<dock.offsetHeight;if(on===dockOn)return;dockOn=on;dock.classList.toggle('on',on);dock.inert=!on;dock.setAttribute('aria-hidden',String(!on))}
addEventListener('scroll',dockCheck,{passive:true});
$('mlcd').onclick=()=>scrollTo({top:0,behavior:reduce?'auto':'smooth'});

// ---------- player (no audio in the mock: it shows the states) ----------
let playing=false,fxOn=false,ptime=0,mq=0,mqLast=0,lastP=0;
const PLAY='<path d="M7 4v16l13-8z"/>',PAUSE='<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>';
function setPlay(on){playing=on;$('picon').innerHTML=on?PAUSE:PLAY;$('play').setAttribute('aria-label',on?'Pause':'Play');if(on&&!fxOn)setFx(true)}
function setFx(on){fxOn=on;$('fx').setAttribute('aria-pressed',String(on))}
$('play').onclick=()=>setPlay(!playing);$('fx').onclick=()=>setFx(!fxOn);
const TITLE="!!!YOU!GOT!A!LOT!TO!FINISH.!LETS!LOCK!IN.!!!";
function player(t){const dt=t-lastP;lastP=t;if(playing)ptime+=dt/1000;if(t-mqLast<240)return;mqLast=t;
 const k=mq%TITLE.length;$('mq').textContent=(TITLE+TITLE).slice(k,k+12);if(playing&&!reduce)mq++;const sec=ptime|0;$('pt').textContent=String(Math.floor(sec/60)).padStart(2,'!')+':'+String(sec%60).padStart(2,'0')}

// ---------- main loop ----------
const segText=x=>x.replace(/ /g,'!');let lastAl=0,shown='',antV=0,antA=0,lastF=f;
function frame(t){
 if(!dragging&&!hold){const d=target-f;f=Math.abs(d)<.002?target:f+d*(reduce?1:.075)}
 const near=nearest(f),dist=Math.abs(near.f-f);afc=false;
 if(!dragging&&!hold&&t-lastMove>420&&Math.abs(target-f)<.01&&dist>.004&&dist<.35&&target!==near.f){target=near.f;afc=true}
 if(Math.abs(target-f)>.003&&Math.abs(target-near.f)<.004&&dist<.35)afc=true;
 const strength=Math.max(0,1-dist/.4),isLock=dist<.06;
 const {ar,nx,ny}=drawDial();rowEls.forEach((r,i)=>r.classList.toggle('on',i===ar));pkeys.forEach((k,i)=>k.setAttribute('aria-pressed',String(i===ar)));
 if(hold){const fg=$('finger');fg.classList.add('on');fg.style.left=(nx)+'px';fg.style.top=(ny+6)+'px'}
 const ds=f.toFixed(1);if(ds!==shown){shown=ds;$('dg').textContent=ds.padStart(5,'!');$('mdg').textContent=ds.padStart(5,'!')}
 smI.forEach((s,i)=>s.classList.toggle('on',i<Math.round(strength*10-(isLock?0:Math.random()*2))));
 $('lt').classList.toggle('on',isLock);$('la').classList.toggle('on',afc);$('mlt').classList.toggle('on',isLock);
 if(t-lastAl>70){lastAl=t;const name=near.k.padEnd(9,' ');const txt=segText(isLock?name:[...name].map(c=>c===' '?' ':(Math.random()<strength*.8?c:(strength>.15?GL[Math.random()*GL.length|0].toUpperCase():' '))).join(''));$('al').textContent=txt;$('mal').textContent=txt}
 if(isLock&&locked!==near){locked=near;lockT=t;wallT=0;S.forEach(s=>s.el.classList.toggle('lock',s===near));show(near);$('lcdtext').textContent=`Tuned to ${near.f.toFixed(1)} MHz: ${BANDS[near.b]}, ${near.k}`;
  if(dragging&&navigator.vibrate)navigator.vibrate(8);
  ripples.push({x:0,y:WH*.5,t0:t,s:.9,max:WW*.9});
  // a seek from the dock keeps the reader on the panel: it held its height while between stations
  const pn=$('panel');pn.style.minHeight='';if(fromDock){fromDock=false;scrollTo({top:pn.getBoundingClientRect().top+scrollY-(dock.offsetHeight+8),behavior:reduce?'auto':'smooth'})}}
 if(!isLock&&locked){const pn=$('panel');pn.style.minHeight=pn.offsetHeight+'px';locked=null;S.forEach(s=>s.el.classList.remove('lock'));$('lcdtext').textContent='Searching between stations'}
 if(!isLock&&strength<.15&&!view.querySelector('.idle'))idle();
 wallFrame(t,near,isLock?1:strength*.6,isLock);
 staticFx(isLock?0:Math.min(.9,(1-strength)*.95));
 if(!reduce){antV+=(-antA*.08)-antV*.12+(f-lastF)*-60;antA+=antV;$('ant').style.transform=`rotate(${-13+Math.max(-9,Math.min(9,antA))}deg)`}
 $('ant').classList.toggle('rx',isLock);lastF=f;player(t);stepDecode(t);dockCheck();requestAnimationFrame(frame)}

// ---------- states for the board ----------
function applyState(){
 if(STATE==='read'){f=target=92.9;setPlay(true);ptime=72;mq=9}
 else if(STATE==='tune'){f=target=93.62;hold=true;dragging=true}
 else if(STATE==='land'||STATE==='top'){f=target=88.7}
 else{lastMove=performance.now();if(reduce)f=target}}
document.fonts.load('800 13px "Barlow Semi Condensed"').then(()=>document.fonts.ready).then(()=>{
 layout();wallLayout();addEventListener('resize',()=>{layout();wallLayout()});applyState();requestAnimationFrame(t=>{frame(t);
  if(STATE==='read')setTimeout(()=>{const p=$('panel');scrollTo(0,p.getBoundingClientRect().top+scrollY-62)},120)})});
}
</script>
</body>
