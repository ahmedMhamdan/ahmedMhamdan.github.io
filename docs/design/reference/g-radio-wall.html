<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ahmed Hamdan · cybersecurity · full-stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,300&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"DSEG7";src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2")}
@font-face{font-family:"DSEG14";src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG14-Classic/DSEG14Classic-Bold.woff2) format("woff2")}
:root{--ground:#121110;--lit:#ff3b1f;--ghost:#2b1915;--amber:#ffb000;--label:#c2b3ab;--quiet:#9a8c85;--dimlabel:#9a7a70;--text:#e6dad3;--rubber:#24211f;--rule:#2a2725;--case:#211d1a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--label)}
body{font-family:"Barlow Semi Condensed",system-ui,sans-serif}
::selection{background:var(--lit);color:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.page{position:fixed;inset:0;display:grid;grid-template-columns:520px 1fr}
.seg{position:relative;display:inline-block;line-height:1;white-space:pre}
.seg .g{color:var(--ghost)}.seg .l{position:absolute;inset:0;color:var(--lit)}

/* ---------- the radio, as one object ---------- */
.stand{position:relative;display:grid;place-items:end center;padding-bottom:24px;overflow:hidden}
.radio{position:relative;width:452px;height:722px;transform-origin:bottom center}
.antenna{position:absolute;right:52px;bottom:calc(100% - 8px);width:7px;height:180px;transform-origin:50% 100%;transform:rotate(-13deg);
  background:linear-gradient(90deg,#4a4642,#bdb7b0 45%,#6d6863 60%,#3a3633);border-radius:3px}
.antenna::before{content:"";position:absolute;left:-1px;right:-1px;top:62px;height:3px;background:#2a2725}
.antenna::after{content:"";position:absolute;left:50%;top:-9px;width:13px;height:13px;margin-left:-6.5px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e9e3dc,#77716b 70%)}
.antenna .tip{position:absolute;left:50%;top:-4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--lit);opacity:0;transition:opacity .15s}
.antenna.rx .tip{opacity:1}
.handle{position:absolute;left:34px;right:34px;bottom:calc(100% - 10px);height:84px;border:16px solid #2c2724;border-bottom:0;border-radius:46px 46px 0 0;box-shadow:inset 0 2px 0 rgba(255,255,255,.05)}
.keys{position:absolute;left:96px;right:96px;bottom:calc(100% - 2px);display:flex;gap:6px;justify-content:center}
.pk{width:44px;height:20px;border-radius:5px 5px 0 0;background:linear-gradient(#3a3532,#26221f);box-shadow:inset 0 1px 0 rgba(255,255,255,.08);
  font-family:"DSEG7";font-size:11px;color:var(--dimlabel);display:grid;place-items:center;transition:transform .12s cubic-bezier(.2,.9,.3,1),height .12s}
.pk[aria-pressed="true"]{transform:translateY(7px);color:var(--lit);background:linear-gradient(#2e2a27,#1f1c1a)}
.case{position:absolute;inset:0;border-radius:28px;background:linear-gradient(180deg,#2a2522,#1c1917 58%,#171412);
  box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.07),inset 0 -3px 0 rgba(0,0,0,.35);
  padding:22px 22px 24px;display:grid;grid-template-rows:144px 204px 30px minmax(0,1fr);gap:12px}
.screw{position:absolute;width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#57514c,#2a2623)}
.screw::after{content:"";position:absolute;left:2px;right:2px;top:5px;height:1px;background:#171412;transform:rotate(35deg)}
.s1{left:10px;top:10px}.s2{right:10px;top:10px}.s3{left:10px;bottom:10px}.s4{right:10px;bottom:10px}
.lcd{border-radius:10px;background:#0b0a09;box-shadow:inset 0 2px 10px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.05);padding:12px 18px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:16px;row-gap:8px;align-items:end}
.fm{font-weight:700;font-size:14px;letter-spacing:.2em;color:var(--lit);padding-bottom:10px}
.digits{font-family:"DSEG7";font-size:56px}
.stat{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:12px}
.alpha{font-family:"DSEG14";font-size:22px;letter-spacing:.04em}
.meters{display:flex;align-items:center;gap:12px}
.lamp{font-weight:700;font-size:12px;letter-spacing:.18em;color:var(--dimlabel)}
.lamp.on{color:var(--lit)}.lamp.amber.on{color:var(--amber)}
.sigm{display:flex;gap:2px}.sigm i{width:5px;height:13px;background:var(--ghost);border-radius:1px}.sigm i.on{background:var(--lit)}.sigm i.hi.on{background:var(--amber)}
.mhz{justify-self:end;align-self:start;font-weight:700;font-size:12px;letter-spacing:.3em;color:var(--quiet);grid-column:2;grid-row:1;padding-top:4px}
.dialwin{position:relative;border-radius:8px;background:#0d0c0b;box-shadow:inset 0 2px 8px rgba(0,0,0,.85);padding:6px 12px;display:grid;grid-template-rows:repeat(5,minmax(0,1fr))}
#scale{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.row{display:grid;grid-template-columns:78px 1fr;min-height:0}
.bandkey{display:flex;align-items:center;gap:8px;text-align:left}
.bandkey b{font-family:"DSEG7";font-size:13px;color:var(--dimlabel);font-weight:400}
.bandkey span{font-weight:700;font-size:12px;letter-spacing:.14em;color:var(--quiet)}
.row.on .bandkey b{color:var(--lit)}.row.on .bandkey span{color:var(--text)}
.track{position:relative}
.stn{position:absolute;top:1px;transform:translateX(-50%);font-weight:700;font-size:12px;letter-spacing:.08em;color:var(--quiet);white-space:nowrap;padding:0 2px}
.row.on .stn{color:var(--label)}.stn:hover{color:#fff}.stn.lock{color:var(--amber)!important}
.plate{display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.plate b{font-weight:800;font-size:15px;letter-spacing:.26em;color:#d9cdc6;white-space:nowrap}
.plate span{font-weight:600;font-size:12px;letter-spacing:.12em;color:var(--quiet);white-space:nowrap}
.lower{display:grid;grid-template-columns:212px 1fr;gap:18px;align-items:center;min-height:0}
.spk{position:relative;width:212px;height:212px;border-radius:50%;background:radial-gradient(circle,#171412 0 60%,#100e0d 61%);box-shadow:inset 0 3px 12px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.05)}
.spk svg{position:absolute;inset:0}
.cone{transform-origin:50% 50%}
.ctrls{display:grid;justify-items:center;gap:12px}
.knob{width:122px;height:122px;border-radius:50%;position:relative;cursor:grab;touch-action:none;
  background:radial-gradient(circle at 40% 34%,#433d39,#211d1a 64%,#161311);box-shadow:0 8px 16px rgba(0,0,0,.6),inset 0 1px 1px rgba(255,255,255,.1)}
.knob:active{cursor:grabbing}
.knob .grip{position:absolute;inset:0;border-radius:50%}
.knob .grip::after{content:"";position:absolute;left:50%;top:11px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:var(--lit)}
.knob .ring{position:absolute;inset:14px;border-radius:50%;border:1px solid #3a3431}
.knob .ticks{position:absolute;inset:-9px;border-radius:50%}
.sub{display:flex;align-items:center;gap:12px}
.seek{width:40px;height:40px;border-radius:50%;background:var(--rubber);box-shadow:0 3px 0 #0a0908,0 4px 8px rgba(0,0,0,.5);display:grid;place-items:center}
.seek:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0908}
.seek svg{width:15px;height:15px;fill:var(--label)}
.vol{width:50px;height:50px;border-radius:50%;position:relative;cursor:grab;touch-action:none;background:radial-gradient(circle at 40% 34%,#433d39,#1d1a17 66%);box-shadow:0 5px 10px rgba(0,0,0,.55)}
.vol .grip{position:absolute;inset:0}.vol .grip::after{content:"";position:absolute;left:50%;top:6px;width:3px;height:11px;margin-left:-1.5px;border-radius:2px;background:var(--text)}
.klabel{font-weight:700;font-size:12px;letter-spacing:.24em;color:var(--quiet)}

/* ---------- the LED wall ---------- */
.program{position:relative;overflow:hidden;min-width:0}
#wall{position:absolute;inset:0}
.over{position:relative;height:100%;display:grid;grid-template-rows:300px minmax(0,1fr) 104px;padding:0 48px}
.stagehead{display:flex;justify-content:space-between;align-items:flex-start;padding-top:28px;font-weight:700;font-size:13px;letter-spacing:.24em;color:var(--quiet);pointer-events:none}
.stagehead b{color:var(--lit)}
.panel{position:relative;min-height:0;border-radius:10px;background:rgba(18,17,16,.9);box-shadow:inset 0 0 0 1px var(--rule),0 20px 40px rgba(0,0,0,.35);backdrop-filter:blur(2px);overflow:hidden}
.view{height:100%;overflow:auto;padding:28px 32px;scrollbar-width:thin;scrollbar-color:#3a3330 transparent}
.view.in>*{animation:slin .55s cubic-bezier(.16,1,.3,1) both}.view.in>*:nth-child(2){animation-delay:.06s}.view.in>*:nth-child(3){animation-delay:.12s}.view.in>*:nth-child(4){animation-delay:.18s}
@keyframes slin{from{opacity:0;transform:translateY(14px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
#static{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;opacity:0;mix-blend-mode:screen}
.k{font-weight:700;font-size:13px;letter-spacing:.24em;color:var(--lit)}
.big{font-weight:600;font-size:2.6rem;line-height:1.02;color:var(--text);margin:6px 0 12px}
.lede{font-size:1.3rem;line-height:1.45;color:var(--text);max-width:52ch}
.txt{font-size:1.15rem;line-height:1.55;color:#d8ccc5;max-width:62ch}
.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin-top:16px;font-size:1.05rem}
.facts dt{font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--quiet);padding-top:4px}.facts dd{color:var(--text)}
.acts{display:flex;gap:12px;margin-top:20px}
.act{height:44px;padding:0 18px;border-radius:6px;background:var(--rubber);box-shadow:0 3px 0 #0a0908,0 5px 10px rgba(0,0,0,.5);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--text)}
.act:hover{color:#fff}.act.lit{background:var(--lit);color:#140806;box-shadow:0 3px 0 #7a1a0c,0 5px 10px rgba(0,0,0,.5)}
.act[disabled]{opacity:.55;cursor:default}
.about{display:grid;grid-template-columns:240px 1fr;gap:34px;align-items:start}
.pic{position:relative;border-radius:4px;overflow:hidden;background:#1d1a18;box-shadow:inset 0 0 0 1px var(--rule)}
.pic img{display:block;width:100%;height:100%;object-fit:cover}
.pic canvas.res{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.pic.tall{aspect-ratio:4/5}.pic.wide{aspect-ratio:16/8}
.pic .ph{position:absolute;left:8px;bottom:8px;font-weight:700;font-size:12px;letter-spacing:.2em;color:#fff;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:3px;z-index:2}
.pic.empty{display:grid;place-items:center;color:var(--dimlabel);font-weight:700;font-size:12px;letter-spacing:.22em}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:14px}
.grid4 figcaption{margin-top:6px;font-size:.95rem;color:var(--quiet)}
.case2{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:start}
.meta{display:flex;gap:30px;flex-wrap:wrap;margin-top:16px}
.meta div{display:grid;gap:3px}.meta span{font-weight:700;font-size:12px;letter-spacing:.22em;color:var(--quiet)}.meta b{font-weight:500;font-size:1.1rem;color:var(--text)}
.list{list-style:none;margin-top:12px;max-width:720px}
.list li{display:flex;justify-content:space-between;gap:24px;padding:13px 0;border-bottom:1px solid var(--rule);font-size:1.15rem;color:var(--text)}
.list li span{font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--quiet);padding-top:4px;white-space:nowrap}
.draft{display:inline-block;margin-left:12px;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--amber);vertical-align:middle}
.poem h2{font-weight:600;font-size:2rem;color:var(--text);margin:6px 0 16px}
.poem p{font-style:italic;font-weight:300;font-size:1.55rem;line-height:1.6;color:var(--text);white-space:pre-line;max-width:40ch}
.contact a{display:flex;justify-content:space-between;align-items:baseline;padding:15px 0;border-bottom:1px solid var(--rule);text-decoration:none;font-size:1.55rem;font-weight:500;color:var(--text)}
.contact a span{font-weight:700;font-size:12px;letter-spacing:.24em;color:var(--quiet)}
.contact a.on{color:var(--lit)}.contact a:hover{color:#fff}
.idle{display:grid;align-content:center;height:100%;gap:8px}.idle .big{color:var(--quiet)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.hint{font-weight:500;font-size:15px;color:var(--quiet)}.hint b{color:var(--label);font-weight:700}
.player{height:76px;display:grid;grid-template-columns:auto auto auto;align-items:center;gap:16px;padding:0 16px 0 10px;border-radius:10px;background:rgba(24,22,21,.94);box-shadow:inset 0 0 0 1px var(--rule)}
.pbtn{width:56px;height:56px;border-radius:50%;background:var(--rubber);box-shadow:0 3px 0 #0a0908,0 5px 10px rgba(0,0,0,.5);display:grid;place-items:center}
.pbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0908}
.pbtn svg{width:20px;height:20px;fill:var(--text)}
.ptxt{display:grid;gap:6px}
.marq{font-family:"DSEG14";font-size:20px;letter-spacing:.04em}
.pcap{display:flex;align-items:baseline;gap:12px;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--quiet)}
.ptime{font-family:"DSEG7";font-size:15px}
.mini{display:flex;align-items:center;gap:8px;font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--label);padding:4px 2px}
.mini i{width:9px;height:9px;border-radius:50%;background:#4a302a}.mini[aria-pressed="true"] i{background:var(--lit)}
</style>
</head>
<body>
<div class="page">
  <aside class="stand" aria-label="Radio">
    <div class="radio" id="radio">
      <div class="antenna" id="ant"><span class="tip"></span></div>
      <div class="handle" aria-hidden="true"></div>
      <div class="keys" id="pkeys" aria-label="Band presets"></div>
      <div class="case">
        <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
        <div class="lcd">
          <span class="fm">FM</span>
          <span class="seg digits"><span class="g" aria-hidden="true">188.8</span><span class="l" id="dg" aria-hidden="true">!88.7</span></span>
          <span class="mhz">MHz</span>
          <div class="stat">
            <span class="seg alpha"><span class="g" aria-hidden="true">~~~~~~~~~</span><span class="l" id="al" aria-hidden="true"></span></span>
            <div class="meters"><span class="lamp" id="lt">TUNED</span><span class="lamp amber" id="la">AFC</span><span class="sigm" id="sm"></span></div>
          </div>
        </div>
        <nav class="dialwin" id="rows" aria-label="Stations"><canvas id="scale" aria-hidden="true"></canvas></nav>
        <div class="plate"><b>AHMED HAMDAN</b><span>CYBERSECURITY · FULL-STACK</span></div>
        <div class="lower">
          <div class="spk" aria-hidden="true"><svg id="grille" viewBox="0 0 212 212"></svg></div>
          <div class="ctrls">
            <div class="knob" id="knob" role="slider" tabindex="0" aria-label="Tuning dial" aria-valuemin="88" aria-valuemax="108" aria-valuenow="88.7"><div class="ring"></div><div class="grip" id="grip"></div></div>
            <span class="klabel">TUNING</span>
            <div class="sub">
              <button class="seek" id="prev" aria-label="Previous station"><svg viewBox="0 0 24 24"><path d="M5 4h3v16H5zM21 4v16L9 12z"/></svg></button>
              <div class="vol" id="vol" role="slider" tabindex="0" aria-label="Volume" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80"><div class="grip" id="vgrip"></div></div>
              <button class="seek" id="next" aria-label="Next station"><svg viewBox="0 0 24 24"><path d="M16 4h3v16h-3zM3 4v16l12-8z"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </aside>
  <main class="program" id="program">
    <canvas id="wall" aria-hidden="true"></canvas>
    <div class="over">
      <div class="stagehead"><span>SIGNAL</span><span id="sigtxt">SEARCHING</span></div>
      <section class="panel" aria-live="polite"><div class="view" id="view"></div><canvas id="static" width="200" height="120" aria-hidden="true"></canvas></section>
      <footer class="foot">
        <p class="hint"><b>Turn the dial</b> · 1–5 jump to a band · ← → next station</p>
        <section class="player" aria-label="What I listen to">
          <button class="pbtn" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="picon"><path d="M7 4v16l13-8z"/></svg></button>
          <div class="ptxt">
            <span class="seg marq"><span class="g" aria-hidden="true">~~~~~~~~~~~~</span><span class="l" id="mq" aria-hidden="true"></span></span>
            <span class="pcap"><span id="ptitle" class="sr"></span>WHAT I LISTEN TO <span class="seg ptime"><span class="g" aria-hidden="true">88:88</span><span class="l" id="pt">!0:00</span></span></span>
          </div>
          <button class="mini" id="fx" aria-pressed="false"><i></i>DIAL FX</button>
          <audio id="au" preload="none"></audio>
        </section>
      </footer>
    </div>
  </main>
</div>
<script>
const LO=88,HI=108,PER=4;
const BANDS=['ME','WORK','SECURITY','POETRY','CONTACT'];
const ME='img/p1005.jpg',SHOT='img/p0.jpg',PH='<span class="ph">PLACEHOLDER</span>';
const contactRows=on=>`<div class="contact">${['Email','GitHub','LinkedIn'].map(n=>`<a href="#" class="${on===n.toUpperCase()?'on':''}">${n}<span>${n==='Email'?'ADDRESS':'PROFILE'} TO CONFIRM</span></a>`).join('')}</div>`;
const poem=n=>`<div class="poem"><p class="k">POETRY · ${n}</p><h2>[ poem title ]</h2><p>[ your poem arrives here,
line by line,
the way you wrote it ]</p></div>`;
const S=[
 [0,'ABOUT',88.7,null,()=>`<div class="about"><figure class="pic tall"><img src="${ME}" alt="Placeholder portrait">${PH}</figure>
  <div><p class="k">ME · ABOUT</p><h2 class="big">Ahmed Hamdan</h2>
  <p class="lede" data-decode>Cybersecurity graduate and full-stack developer. I build web apps with Laravel and React, with security designed in from the start.</p>
  <dl class="facts"><dt>FOCUS</dt><dd>Application security, Laravel, React</dd><dt>LANGUAGES</dt><dd>English, Arabic</dd><dt>OFF THE CLOCK</dt><dd>Poetry</dd></dl>
  <div class="acts"><button class="act lit" data-tune="104.9">GET IN TOUCH</button><button class="act" data-tune="92.9">SEE THE WORK</button></div></div></div>`],
 [0,'PHOTOS',90.1,ME,()=>`<p class="k">ME · PHOTOS</p><h2 class="big">Photos</h2><div class="grid4">
  <figure><div class="pic tall"><img src="${ME}" alt="Placeholder photo">${PH}</div><figcaption>[ where it was taken ]</figcaption></figure>
  <figure><div class="pic tall"><img src="${SHOT}" alt="Placeholder photo">${PH}</div><figcaption>[ where it was taken ]</figcaption></figure>
  <figure><div class="pic tall empty">YOURS</div></figure><figure><div class="pic tall empty">YOURS</div></figure></div>`],
 [0,'STORY',91.4,null,()=>`<p class="k">ME · STORY</p><h2 class="big">Where I come from, where I'm going</h2>
  <p class="txt" data-decode>[ Your story in your own words: where you studied, what pulled you into security and building for the web, and where you are heading next. ]</p>`],
 [1,'ELANCER',92.9,SHOT,()=>`<div class="case2"><figure class="pic wide"><img src="${SHOT}" alt="Placeholder screenshot">${PH}</figure>
  <div><p class="k">WORK · ELANCER</p><h2 class="big">Elancer</h2><p class="lede" data-decode>A bilingual freelance marketplace, English and Arabic, built with Laravel and React.</p>
  <div class="meta"><div><span>ROLE</span><b>Full-stack developer</b></div><div><span>STACK</span><b>Laravel, React</b></div><div><span>STATUS</span><b>In progress</b></div></div>
  <div class="acts"><button class="act" disabled>CASE STUDY · SOON</button><button class="act">SOURCE</button></div></div></div>`],
 [1,'LARAVEL',94.3,null,()=>`<p class="k">WORK · LARAVEL</p><h2 class="big">Laravel<span class="draft">DRAFT LIST</span></h2>
  <ul class="list"><li>APIs and resources<span>BACKEND</span></li><li>Authentication and authorization<span>SECURITY</span></li><li>Database design and migrations<span>DATA</span></li><li>Queues and jobs<span>BACKEND</span></li></ul>`],

function player(t){if(t-mqLast<240)return;mqLast=t;const s='!!!'+TRACKS[0].title.toUpperCase().replace(/[^A-Z0-9 .-]/g,'').replace(/ /g,'!')+'!!!';
 const k=mq%s.length;$('mq').textContent=(s+s).slice(k,k+12);if(!au.paused)mq++;const sec=au.currentTime|0;$('pt').textContent=String(Math.floor(sec/60)%100).padStart(2,'!')+':'+String(sec%60).padStart(2,'0')}
let cone=null,antV=0,antA=0;
function physical(isLock){// speaker cone follows the bass; antenna springs when you tune
 if(!cone)cone=$('cone');let lvl=0;if(analyser&&!au.paused){analyser.getByteTimeDomainData(tbins);let m=0;for(let i=0;i<tbins.length;i++)m=Math.max(m,Math.abs(tbins[i]-128));lvl=m/128}
 cone.style.transform=`scale(${1+lvl*.07})`;antV+=(-antA*.08)-antV*.12+(f-lastF)*-60;antA+=antV;$('ant').style.transform=`rotate(${-13+Math.max(-9,Math.min(9,antA))}deg)`;$('ant').classList.toggle('rx',isLock)}

// ---------- main loop ----------
let lastAl=0,shown='';
function frame(t){
 const dragOn=dragging();if(!dragOn){const d=target-f;f=Math.abs(d)<.002?target:f+d*(reduce?1:.075)}
 const near=nearest(f),dist=Math.abs(near.f-f);afc=false;
 if(!dragOn&&t-lastMove>420&&Math.abs(target-f)<.01&&dist>.004&&dist<.35&&target!==near.f){target=near.f;afc=true}
 if(Math.abs(target-f)>.003&&Math.abs(target-near.f)<.004&&dist<.35)afc=true;
 const strength=Math.max(0,1-dist/.4),isLock=dist<.06;
 const ar=drawDial();rowEls.forEach((r,i)=>r.classList.toggle('on',i===ar));pkeys.forEach((k,i)=>k.setAttribute('aria-pressed',i===ar));
 const ds=f.toFixed(1);if(ds!==shown){shown=ds;$('dg').textContent=ds.padStart(5,'!');knob.setAttribute('aria-valuenow',ds)}
 grip.style.transform=`rotate(${(f-LO)/2*360}deg)`;
 smI.forEach((s,i)=>s.classList.toggle('on',i<Math.round(strength*10-(isLock?0:Math.random()*2))));
 $('lt').classList.toggle('on',isLock);$('la').classList.toggle('on',afc);
 if(t-lastAl>70){lastAl=t;const name=near.k.padEnd(9,' ');$('al').textContent=segText(isLock?name:[...name].map(c=>c===' '?' ':(Math.random()<strength*.8?c:(strength>.15?GL[Math.random()*GL.length|0].toUpperCase():' '))).join(''))}
 if(isLock&&locked!==near){locked=near;lockT=t;wallT=t/1000;lockClick();S.forEach(s=>s.el.classList.toggle('lock',s===near));show(near);
  $('sigtxt').innerHTML=`<b>${BANDS[near.b]} · ${near.k}</b> · ${near.f.toFixed(1)} MHz`;
  ripples.push({x:0,y:WH*.45,t0:t,s:.9,max:WW*.9})}
 if(!isLock&&locked){locked=null;S.forEach(s=>s.el.classList.remove('lock'));$('sigtxt').textContent='SEARCHING'}
 if(!isLock&&strength<.15&&!view.querySelector('.idle'))idle();
 wallFrame(t,near,isLock?1:strength*.6,isLock);
 staticFx(isLock?0:Math.min(.9,(1-strength)*.95));
 spd=spd*.85+Math.abs(f-lastF)*.15;audioTick(strength,dist,isLock);physical(isLock);lastF=f;player(t);stepDecode(t);requestAnimationFrame(frame)}
document.fonts.ready.then(()=>{layout();wallLayout();addEventListener('resize',()=>{layout();wallLayout()});setVol(.8);lastMove=performance.now();if(reduce)f=target;requestAnimationFrame(frame)});
</script>
